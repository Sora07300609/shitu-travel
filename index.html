function removeDish(i,meal,k){state.days[i].dishes[meal].splice(k,1);persist();render()}
function renderDining(){}
function renderEditor(){$('dayEditor').innerHTML=state.days.map((d,i)=>`<section class="paired-day" style="--c:${color(i)}"><section class="day-section ${i===state.active?'active':''}"><h2 onclick="selectDay(${i})">第 ${i+1} 天</h2>${periods.map(p=>destinationGroup(d,i,p)).join('')}<button class="delete-day" title="删除第${i+1}天" aria-label="删除第${i+1}天" onclick="removeDay(${i})" ${state.days.length===1?'disabled':''}>×</button></section><section class="dining-day ${i===state.active?'active':''}"><h2 onclick="selectDay(${i})">第 ${i+1} 天</h2>${mealNames.map(meal=>mealGroup(d,i,meal)).join('')}</section></section>`).join('')}
function render(){state.days.forEach(d=>d.rows.forEach(r=>r.uid=r.uid||crypto.randomUUID()));renderEditor();renderDetails();draw();persist()}
function renderDetails(){$('source').textContent=state.city+' · OpenStreetMap 真实地图';$('filter').textContent=filter?'显示全部天数':'只看当天';$('mapTitle').textContent=state.city+' · 第'+(state.active+1)+'天';$('meals').innerHTML='';renderDining();renderMemos()}

function manualLeg(key,field,value){day().legs[key]={...day().legs[key],[field]:field==='minutes'?(value===''?'':Math.max(0,Number(value)||0)):value};persist();draw()}
function renderMemos(){$('memoCaption').textContent=state.city+(cityData[state.city]?'景点与地方风味参考，非实时热度排名。':'暂无预置推荐，可自主添加。')+' 各城市备忘与行程独立保存。';for(const [kind,id] of [['places','placeMemos'],['foods','foodMemos']]){$(id).innerHTML=state.memos[kind].map((word,i)=>`<span class="memo-chip"><span>${esc(word)}</span><button type="button" aria-label="删除${esc(word)}" onclick="removeMemo('${kind}',${i})">×</button></span>`).join('')||'<small>还没有词条，随手记下一个吧。</small>'}}
function addMemo(kind){let input=$('memo-'+kind),word=input.value.trim();if(word&&!state.memos[kind].includes(word)){state.memos[kind].push(word);persist();renderMemos()}input.value='';input.focus()}
function removeMemo(kind,i){state.memos[kind].splice(i,1);persist();renderMemos()}
function draft(i,j,text){let r=state.days[i]?.rows[j];if(!r)return;r.text=text;if(r.resolvedText!==text.trim()){r.coords=null;r.notice=''}persist();draw()}
function commitRow(i,j){let d=state.days[i],r=d?.rows[j];if(!r)return;let text=r.text.trim(),city=state.city,center=state.center||[35,105],cacheKey=city+'|'+text;state.active=i;renderDetails();if(!text){r.coords=null;r.notice='';persist();draw();return}if(r.coords&&r.resolvedText===text)return;status('正在地图上查找：'+text);queue=queue.catch(()=>{}).then(async()=>{if(!state.days.includes(d)||!d.rows.includes(r)||r.text.trim()!==text)return;try{let features=cache[cacheKey];if(!features){let url='https://photon.komoot.io/api/?'+new URLSearchParams({q:city+' '+text,lat:String(center[0]),lon:String(center[1]),limit:'5'});let response=await fetch(url,{signal:AbortSignal.timeout(12000)});if(!response.ok)throw Error('search');let result=await response.json();features=result.features||[];cache[cacheKey]=features;await new Promise(resolve=>setTimeout(resolve,1100))}if(!state.days.includes(d)||!d.rows.includes(r)||r.text.trim()!==text||(r.coords&&r.resolvedText===text))return;let hit=features.find(f=>{let [lng,lat]=f.geometry.coordinates;return !state.center||(Math.abs(lng-state.center[1])<1.8&&Math.abs(lat-state.center[0])<1.8)});if(!hit){r.notice='未找到当前城市的地点：可补充详细地址，或点击地图手动标记';status(r.notice)}else{let [lng,lat]=hit.geometry.coordinates;r.coords=[lat,lng];r.resolvedText=text;r.notice='已标记 · '+(hit.properties.name||text);status('已标记 '+text);draw();if(map)map.panTo(r.coords)}persist();refreshNotice(r)}catch(e){if(d.rows.includes(r)&&r.text.trim()===text){r.notice='地图搜索暂不可用，可点击地图手动标记此目的地';status(r.notice);refreshNotice(r)}}});window.lastEdited={d,r}}
function refreshNotice(r){let el=$('notice-'+r.uid);if(el)el.textContent=r.notice}
let trafficSelection=null,trafficEditing=null;
function pickTraffic(di,uid){let d=state.days[di],r=d?.rows.find(r=>r.uid===uid);if(!r?.coords||!r.text.trim())return status('先填写并在地图上标记此目的地，再选择交通端点。');window.lastEdited=null;state.active=di;renderDetails();persist();if(!trafficSelection||trafficSelection.d!==d){trafficSelection={d,uid};draw();if(map)map.panTo(r.coords);status('起点：'+r.text+'，请点击同一天的另一个目的地作为终点。');return}if(trafficSelection.uid===uid)return status('请选择另一个目的地作为终点。');openTraffic(d,trafficSelection.uid,uid)}
function openTraffic(d,a,b){let from=d.rows.find(r=>r.uid===a),to=d.rows.find(r=>r.uid===b);if(!from?.coords||!to?.coords)return;trafficSelection={d,uid:a,end:b};trafficEditing={state,d,a,b};let leg=d.legs[a+'|'+b]||{};$('trafficPair').textContent=from.text+' → '+to.text;$('trafficMode').value=leg.mode||'';$('trafficMinutes').value=leg.minutes??'';draw();$('trafficDialog').showModal();$('trafficMode').focus()}
function saveTraffic(){let t=trafficEditing;if(!t||t.state!==state||!state.days.includes(t.d)||!t.d.rows.some(r=>r.uid===t.a)||!t.d.rows.some(r=>r.uid===t.b)){closeTraffic();return}let mode=$('trafficMode').value.trim(),minutes=$('trafficMinutes').value;if(!mode||minutes===''||!Number.isFinite(+minutes)||+minutes<0)return;t.d.legs[t.a+'|'+t.b]={mode,minutes:+minutes};persist();closeTraffic();status('已将交通方式和时间标在地图上。')}
function finishTraffic(){trafficSelection=null;trafficEditing=null;draw()}
function closeTraffic(){$('trafficDialog').close();finishTraffic()}
function draw(){if(!map)return;layers.clearLayers();state.days.forEach((d,di)=>{if(filter&&di!==state.active)return;d.rows.forEach((r,j)=>{if(!r.coords||!r.text.trim())return;let picked=trafficSelection?.d===d&&(trafficSelection.uid===r.uid||trafficSelection.end===r.uid),marker=L.marker(r.coords,{icon:L.divIcon({className:'',html:`<div class="map-number ${picked?'route-picked':''}" style="background:${color(di)}">${d.rows.slice(0,j+1).filter(x=>x.period===r.period).length}</div>`,iconSize:[30,30],iconAnchor:[15,15]})}).addTo(layers);marker.bindTooltip(esc('第'+(di+1)+'天 · '+r.period+' · '+r.text),{direction:'top'});marker.on('click',()=>pickTraffic(di,r.uid))});let rows=d.rows.filter(r=>r.text.trim()),edges=new Set(rows.slice(1).map((b,i)=>rows[i].uid+'|'+b.uid));Object.keys(d.legs).forEach(key=>edges.add(key));edges.forEach(key=>{let [aid,bid]=key.split('|'),a=d.rows.find(r=>r.uid===aid),b=d.rows.find(r=>r.uid===bid);if(!a?.coords||!b?.coords||!a.text.trim()||!b.text.trim())return;let line=L.polyline([a.coords,b.coords],{color:color(di),weight:4,opacity:di===state.active?1:.5}).addTo(layers),leg=d.legs[key];let label=[leg?.mode,leg?.minutes!==undefined&&leg.minutes!==''?leg.minutes+'分钟':''].filter(Boolean).join(' · ');if(label)line.bindTooltip(esc(label),{permanent:true,direction:'center',className:'tag'});line.on('click',e=>{if(e?.originalEvent)L.DomEvent.stopPropagation(e.originalEvent);openTraffic(d,aid,bid)})})})}
function initMap(){if(!window.L)return;try{$('map').innerHTML='';map=L.map('map').setView(state.center||[35,105],state.center?12:5);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map).on('tileerror',()=>status('地图瓦片加载失败，请检查网络后刷新。'));layers=L.layerGroup().addTo(map);map.on('click',e=>{let target=window.lastEdited;if(!target||!state.days.includes(target.d)||!target.d.rows.includes(target.r)||!target.r.text.trim())return;let r=target.r;r.coords=[e.latlng.lat,e.latlng.lng];r.resolvedText=r.text.trim();r.notice='已手动标记';persist();draw();status('已在点击位置标记 '+r.text);window.lastEdited=null});$('mapNote').textContent='OpenStreetMap 真实底图 · 输入完成后自动尝试标记；如搜索无结果，点击地图手动放置刚填写的地点。依次点击同一天两个标记可记录交通，点击连线可修改。连线非道路导航。';draw()}catch(e){status('地图初始化失败，请检查网络并刷新。')}}
function showBaseMap(){let [lat,lng]=state.center||[35,105],delta=state.center?0.1:10;$('map').innerHTML=`<iframe title="${esc(state.city)}真实地图" src="https://www.openstreetmap.org/export/embed.html?bbox=${[lng-delta,lat-delta,lng+delta,lat+delta].join('%2C')}&layer=mapnik"></iframe>`}
let cityRequest=0;
async function switchCity(){let city=normalizeCity($('city').value);if(!city)return;persist();if(city===state.city){$('city').value=city;return}let seq=++cityRequest;state=book.cities[city]||createCity(city);filter=false;trafficSelection=null;trafficEditing=null;window.lastEdited=null;$('city').value=city;render();if(map)map.setView(state.center||[35,105],state.center?12:5);else showBaseMap();if(state.center){status('已切换到 '+city);return}status('正在查找 '+city+' 的地图位置…');try{let response=await fetch('https://photon.komoot.io/api/?'+new URLSearchParams({q:city,limit:'5'}),{signal:AbortSignal.timeout(12000)});if(!response.ok)throw Error('city');let data=await response.json();if(seq!==cityRequest||state.city!==city)return;let hit=data.features?.find(f=>['city','town','county'].includes(f.properties?.type))||data.features?.[0];if(!hit)throw Error('none');let [lng,lat]=hit.geometry.coordinates;state.center=[lat,lng];persist();if(map)map.setView(state.center,12);else showBaseMap();status('已切换到 '+city+'，可自行添加目的地与美食。')}catch(e){if(seq===cityRequest)status('城市已保存，地图位置查询失败；可拖动地图到该城市。')}}
$('cityOptions').innerHTML=Object.keys(cityData).map(c=>`<option value="${c}">`).join('');$('city').value=state.city;render();showBaseMap();$('mapNote').textContent='正在加载真实地图…';let lib=document.createElement('script');lib.src='https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js';lib.onload=initMap;lib.onerror=()=>status('交互地图加载失败，已保留真实地图底图；请检查网络。');document.head.appendChild(lib);
</script></html>
