
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>拾途 · 旅行协作空间</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7fa;color:#263344;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
header{background:#fff;border-bottom:1px solid #e8edf2;padding:18px 5%}
.wrap{max-width:1050px;margin:auto}
h1{margin:0;font-size:25px}
h2{font-size:21px}
h3{margin:0 0 8px}
p{color:#748094}
main{padding:22px 16px 60px}
.panel,.item{background:#fff;border:1px solid #e6ebf2;border-radius:16px;padding:20px;margin-bottom:16px}
nav{display:flex;flex-wrap:wrap;gap:9px;margin:20px 0}
button{border:0;border-radius:10px;padding:11px 15px;background:#edf2f8;color:#334155;cursor:pointer;font-size:14px}
button.primary,.active{background:#377df5;color:white}
button.danger{background:#fff0f0;color:#c33}
button:disabled{opacity:.5;cursor:not-allowed}
input,textarea,select{width:100%;padding:12px;border:1px solid #dce3ed;border-radius:10px;font:inherit;margin:7px 0 12px;background:white}
textarea{min-height:95px;resize:vertical}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row>*{flex-shrink:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.small{font-size:13px;color:#8190a3}
.bar{height:9px;background:#edf1f7;border-radius:9px;overflow:hidden;margin:10px 0}
.fill{height:100%;background:#377df5}
.photo{max-width:100%;max-height:320px;border-radius:12px;margin:12px 0;object-fit:contain}
.tag{display:inline-block;background:#eff5ff;color:#377df5;border-radius:20px;padding:5px 10px;font-size:12px}
.empty{text-align:center;padding:30px;color:#8995a5}
</style>
</head>
<body>
<header>
<div class="wrap">
<h1>🌍 拾途 · 旅行协作空间</h1>
<p>一起计划旅程，一起留下回忆</p>
<div class="row">
<label for="nickname">当前参与者</label>
<input id="nickname" style="max-width:180px;margin:0" placeholder="输入昵称">
<span class="tag">本地演示模式</span>
</div>
</div>
</header>

<main class="wrap">
<nav id="tabs"></nav>
<div id="content"></div>
</main>

<script>
const KEY="shitu_collaboration_demo_v1";
const categories={
destination:"📍 目的地",
date:"📅 旅行时间",
wish:"✨ 旅行愿望",
food:"🍜 美食",
diary:"📖 旅行记录",
souvenir:"🎁 纪念品"
};
let section="destination";
let user=localStorage.getItem("shitu_demo_user")||"游客";
let db=load();

function initial(){
return {
destination:[],date:[],wish:[],food:[],
diary:[],souvenir:[]
};
}
function load(){
try{
const d=JSON.parse(localStorage.getItem(KEY));
return d&&typeof d==="object"?{...initial(),...d}:initial();
}catch{return initial()}
}
function save(){
try{localStorage.setItem(KEY,JSON.stringify(db));return true}
catch{
alert("浏览器存储空间不足。请减少图片大小。");
return false;
}
}
function uid(){
return crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();
}
function esc(s){
return String(s??"").replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",
'"':"&quot;","'":"&#39;"
})[c]);
}
function name(){
return user.trim()||"游客";
}
function find(id){
return db[section].find(x=>x.id===id);
}
function total(x){
return Object.keys(x.votes||{}).length;
}
function count(x){
return Object.values(x.votes||{}).filter(Boolean).length;
}
function tabs(){
document.getElementById("tabs").innerHTML=
Object.entries(categories).map(([key,label])=>
`<button class="${section===key?"active":""}"
onclick="switchTab('${key}')">${label}</button>`
).join("");
}
function switchTab(key){
section=key;
render();
}
function render(){
tabs();
if(section==="diary")renderDiary();
else if(section==="souvenir")renderSouvenirs();
else renderPolls();
}
function renderPolls(){
const arr=db[section];
const sorted=[...arr].sort((a,b)=>count(b)-count(a));
document.getElementById("content").innerHTML=`
<div class="panel">
<h2>${categories[section]} · 合作提案与投票</h2>
<p>每位参与者可以提出建议、编辑自己的建议，并投票支持。</p>
<input id="newTitle" placeholder="${section==="date"?"例如：2027年7月10日—7月15日":"输入你的提案"}">
<textarea id="newNote" placeholder="补充理由、攻略或想法（可选）"></textarea>
<button class="primary" onclick="addProposal()">＋ 添加提案</button>
</div>
<h2>投票结果与提案 (${arr.length})</h2>
${sorted.length?sorted.map((x,i)=>{
const n=count(x),t=Math.max(1,...arr.map(count));
const voted=!!x.votes?.[name()];
return `<div class="item">
<div class="row">
<span class="tag">排名 ${i+1}</span>
<span class="small">由 ${esc(x.author)} 提出</span>
</div>
<h3 style="margin-top:12px">${esc(x.title)}</h3>
<p>${esc(x.note)}</p>
<div class="row">
<strong>${n} 票</strong>
<span class="small">${total(x)} 人参与投票</span>
</div>
<div class="bar"><div class="fill" style="width:${n/t*100}%"></div></div>
<div class="row">
<button class="${voted?"":"primary"}" onclick="vote('${x.id}')">
${voted?"取消支持":"👍 投票支持"}
</button>
<button onclick="editProposal('${x.id}')">编辑</button>
<button class="danger" onclick="removeItem('${x.id}')">删除</button>
</div>
</div>`;
}).join(""):`<div class="panel empty">还没有提案，添加第一个吧！</div>`}`;
}
function addProposal(){
const title=document.getElementById("newTitle").value.trim();
const note=document.getElementById("newNote").value.trim();
if(!title)return alert("请输入提案内容");
db[section].push({
id:uid(),title,note,author:name(),votes:{}
});
save();render();
}
function vote(id){
const x=find(id);
if(!x)return;
x.votes=x.votes||{};
if(x.votes[name()])delete x.votes[name()];
else x.votes[name()]=true;
save();render();
}
function editProposal(id){
const x=find(id);
if(!x)return;
const title=prompt("修改提案",x.title);
if(title===null)return;
if(!title.trim())return alert("内容不能为空");
const note=prompt("修改补充说明",x.note||"");
if(note===null)return;
x.title=title.trim();
x.note=note.trim();
save();render();
}
function removeItem(id){
if(!confirm("确定删除这条内容吗？"))return;
db[section]=db[section].filter(x=>x.id!==id);
save();render();
}
function renderDiary(){
document.getElementById("content").innerHTML=`
<div class="panel">
<h2>📖 旅行文字与图片</h2>
<p>记录旅行故事、照片、感受和难忘瞬间。</p>
<input id="diaryTitle" placeholder="例如：成都旅行第一天">
<textarea id="diaryText" placeholder="写下你的旅行故事……"></textarea>
<label>添加旅行照片</label>
<input id="diaryPhoto" type="file" accept="image/*">
<button class="primary" onclick="addDiary()">＋ 发布旅行记录</button>
</div>
${db.diary.length?[...db.diary].reverse().map(x=>`
<div class="item">
<span class="small">${esc(x.author)} · ${esc(x.time)}</span>
<h3 style="margin-top:12px">${esc(x.title)}</h3>
<p style="white-space:pre-wrap">${esc(x.text)}</p>
${x.photo?`<img class="photo" src="${x.photo}" alt="旅行照片">`:""}
<div class="row">
<button onclick="editDiary('${x.id}')">编辑文字</button>
<button class="danger" onclick="removeItem('${x.id}')">删除</button>
</div>
</div>`).join(""):`<div class="panel empty">还没有旅行记录</div>`}`;
}
async function addDiary(){
const title=document.getElementById("diaryTitle").value.trim();
const text=document.getElementById("diaryText").value.trim();
const file=document.getElementById("diaryPhoto").files[0];
if(!title)return alert("请输入标题");
let photo="";
if(file){
if(file.size>2*1024*1024)
return alert("演示版请使用小于 2MB 的图片");
photo=await fileToData(file);
}
db.diary.push({
id:uid(),title,text,photo,
author:name(),time:new Date().toLocaleString("zh-CN")
});
if(!save())db.diary.pop();
render();
}
function fileToData(file){
return new Promise((resolve,reject)=>{
const reader=new FileReader();
reader.onload=()=>resolve(reader.result);
reader.onerror=reject;
reader.readAsDataURL(file);
});
}
function editDiary(id){
const x=find(id);
if(!x)return;
const title=prompt("修改标题",x.title);
if(title===null)return;
const text=prompt("修改旅行文字",x.text);
if(text===null)return;
x.title=title.trim()||x.title;
x.text=text;
save();render();
}
function renderSouvenirs(){
document.getElementById("content").innerHTML=`
<div class="panel">
<h2>🎁 纪念品合作清单</h2>
<p>一起记录想买的纪念品和购买进度。</p>
<input id="giftName" placeholder="纪念品名称">
<input id="giftPlace" placeholder="购买地点（可选）">
<input id="giftPrice" type="number" min="0" placeholder="预算金额（元，可选）">
<button class="primary" onclick="addSouvenir()">＋ 添加纪念品</button>
</div>
${db.souvenir.length?db.souvenir.map(x=>`
<div class="item">
<div class="row">
<h3>${esc(x.title)}</h3>
<span class="tag">${x.bought?"已购买":"待购买"}</span>
</div>
<p>📍 ${esc(x.place||"未填写地点")} ·
预算 ¥${esc(x.price||"未填写")}</p>
<p class="small">添加者：${esc(x.author)}</p>
<div class="row">
<button class="primary" onclick="toggleBought('${x.id}')">
${x.bought?"改为待购买":"✓ 标记已购买"}
</button>
<button onclick="editSouvenir('${x.id}')">编辑</button>
<button class="danger" onclick="removeItem('${x.id}')">删除</button>
</div>
</div>`).join(""):`<div class="panel empty">还没有纪念品</div>`}`;
}
function addSouvenir(){
const title=document.getElementById("giftName").value.trim();
if(!title)return alert("请输入纪念品名称");
db.souvenir.push({
id:uid(),title,
place:document.getElementById("giftPlace").value.trim(),
price:document.getElementById("giftPrice").value,
bought:false,author:name()
});
save();render();
}
function toggleBought(id){
const x=find(id);
if(!x)return;
x.bought=!x.bought;
save();render();
}
function editSouvenir(id){
const x=find(id);
if(!x)return;
const title=prompt("纪念品名称",x.title);
if(title===null)return;
const place=prompt("购买地点",x.place);
if(place===null)return;
const price=prompt("预算金额",x.price);
if(price===null)return;
x.title=title.trim()||x.title;
x.place=place;
x.price=price;
save();render();
}
document.getElementById("nickname").value=user;
document.getElementById("nickname").onchange=e=>{
user=e.target.value.trim()||"游客";
localStorage.setItem("shitu_demo_user",user);
render();
};
render();
</script>
</body>
</html>
